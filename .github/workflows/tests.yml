name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # MetaTrader5 is Windows-only and deliberately not installed here:
      # the bot must stay importable and testable without it.
      - run: pip install pandas numpy pytest
      - run: python -m pytest forex_bot/tests -q
      - name: compile every module
        run: python -m compileall -q forex_bot
